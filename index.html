<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>فناوری‌های نوظهور</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ---------- Design tokens ---------- */
:root{--bg1:#07090e;--bg2:#0d111a;--cy:#00f0ff;--bl:#2979ff;--pu:#7000ff;--tx:#e8edf5;--mu:#8b95a8;
--glass:rgba(255,255,255,.04);--bd:rgba(0,240,255,.18);box-sizing:border-box;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
*{box-sizing:border-box;margin:0}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--tx);font-family:'Vazirmatn',sans-serif;font-weight:400;min-height:100vh;overflow-x:hidden}
.mono{font-family:'JetBrains Mono',monospace}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
/* ---------- Top bar ---------- */
header{position:fixed;top:env(safe-area-inset-top,0px);inset-inline:0;z-index:20;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:rgba(7,9,14,.7);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--bd)}
.brand{font-weight:900;font-size:1.05rem;letter-spacing:.5px}
.brand b{color:var(--cy);font-family:'JetBrains Mono',monospace;font-weight:700}
.hr{display:flex;gap:14px;align-items:center}
#timer{font-family:'JetBrains Mono',monospace;color:var(--cy);font-size:.95rem;padding:6px 12px;border:1px solid var(--bd);border-radius:8px;direction:ltr}
button{font-family:inherit;cursor:pointer;transition:.25s}
.btn{background:var(--glass);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px 18px;font-size:.9rem}
.btn:hover{box-shadow:0 0 18px rgba(0,240,255,.45);transform:scale(1.05);color:var(--cy);border-color:var(--cy)}
main{position:relative;z-index:1}
/* ---------- Hero ---------- */
.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:100px 20px 40px;perspective:900px}
.hl{transition:transform .2s ease-out;will-change:transform}
.tag{font-family:'JetBrains Mono',monospace;color:var(--cy);font-size:.8rem;letter-spacing:3px;margin-bottom:18px;direction:ltr}
h1{font-weight:900;font-size:clamp(2.4rem,8vw,5.5rem);line-height:1.3;background:linear-gradient(90deg,var(--cy),var(--bl),var(--pu),var(--cy));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shift 6s linear infinite}
@keyframes shift{to{background-position:300% 0}}
.sub{font-weight:300;font-size:clamp(1.1rem,3vw,1.8rem);margin-top:18px;color:var(--mu);min-height:2.4rem}
.sub span{color:var(--tx);font-weight:700}
.sub i{display:inline-block;width:2px;height:1.2em;background:var(--cy);vertical-align:middle;margin-inline-start:4px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.stats{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:44px}
.stat{min-width:140px;padding:18px 24px;background:var(--glass);border:1px solid var(--bd);border-radius:14px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.stat b{display:block;font-family:'JetBrains Mono',monospace;font-size:2.2rem;color:var(--cy);direction:ltr}
.stat small{color:var(--mu);font-weight:300}
/* ---------- Topic rail ---------- */
.wrap{max-width:1200px;margin:0 auto;padding:40px 20px 120px}
.rail{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 18px;scrollbar-width:none}
.tab{flex:1 0 auto;background:var(--glass);color:var(--mu);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px 20px;font-size:.95rem;white-space:nowrap}
.tab .n{font-family:'JetBrains Mono',monospace;color:var(--cy);margin-inline-end:8px;font-size:.8rem}
.tab:hover{color:var(--tx);transform:translateY(-2px);box-shadow:0 0 16px rgba(41,121,255,.4)}
.tab.on{color:var(--tx);font-weight:700;border-color:var(--cy);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 6px rgba(0,240,255,.3)}50%{box-shadow:0 0 22px rgba(0,240,255,.8)}}
h2{font-weight:900;font-size:clamp(1.6rem,4vw,2.6rem);margin:18px 0 6px}
.en{font-family:'JetBrains Mono',monospace;color:var(--bl);font-size:.85rem;direction:ltr;text-align:right;margin-bottom:26px}
/* ---------- Cards ---------- */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;transition:opacity .3s,transform .3s}
.grid{perspective:1200px}.grid.out{opacity:0;transform:rotateY(-25deg) translateX(60px) scale(.94)}
.grid.in{opacity:0;transform:rotateY(25deg) translateX(-60px) scale(.94)}
.card{perspective:800px;opacity:0;transform:translate(var(--tx,0),60px) rotateX(35deg) rotateY(var(--ry,0)) scale(.9);transition:opacity .8s,transform .8s cubic-bezier(.2,.9,.2,1)}
.card.show{opacity:1;transform:none}
.inner{height:100%;padding:28px;background:var(--glass);border:1px solid var(--bd);border-radius:18px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 0 30px rgba(41,121,255,.08),inset 0 0 30px rgba(112,0,255,.05);transition:transform .15s ease-out,box-shadow .3s;transform-style:preserve-3d}
.inner:hover{box-shadow:0 0 36px rgba(0,240,255,.25),inset 0 0 30px rgba(112,0,255,.1)}
.lab{font-family:'JetBrains Mono',monospace;color:var(--cy);font-size:.8rem;letter-spacing:2px;direction:ltr;text-align:right}
.inner h3{font-weight:700;font-size:1.3rem;margin:8px 0 12px}
.inner p{font-weight:300;line-height:2.1;text-align:justify;color:#cfd7e6;font-size:1rem}
/* ---------- Footer ---------- */
footer{position:fixed;bottom:env(safe-area-inset-bottom,0px);inset-inline:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 24px;background:rgba(7,9,14,.75);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--bd)}
.hint{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--mu);direction:ltr}
.hint kbd{border:1px solid var(--bd);border-radius:4px;padding:1px 6px;color:var(--cy)}
/* ---------- Round 6: 3D ring, ghost number, scramble, accents ---------- */
.cw{height:270px;position:relative;--rad:230px}
@media(max-width:800px){.cw{--rad:150px}}
.ring3{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d;animation:rs 24s linear infinite}
@keyframes rs{from{transform:rotateX(-12deg) rotateY(0)}to{transform:rotateX(-12deg) rotateY(360deg)}}
.pn{position:absolute;width:130px;height:44px;margin:-22px -65px;display:flex;align-items:center;justify-content:center;border:1px solid var(--cy);background:rgba(7,9,14,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:10px;font-size:.85rem;white-space:nowrap;cursor:pointer;backface-visibility:hidden;box-shadow:0 0 18px rgba(0,240,255,.3)}
.pn:hover{background:rgba(0,240,255,.2)}
.wrap{position:relative}
.ghost{position:absolute;top:40px;inset-inline-start:0;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:clamp(8rem,28vw,20rem);color:transparent;-webkit-text-stroke:1px rgba(0,240,255,.14);pointer-events:none;z-index:-1;direction:ltr;animation:gh 8s ease-in-out infinite alternate}
@keyframes gh{to{transform:translateY(30px) rotateY(25deg)}}
.card:nth-child(odd){--tx:80px;--ry:-25deg}.card:nth-child(even){--tx:-80px;--ry:25deg}
.tab.on{transform:translateY(-3px) scale(1.06)}
/* ---------- Real photo frames (3D tilt + HUD) ---------- */
.vis{display:grid;grid-template-columns:1fr 1fr;gap:18px}.vis.np{grid-template-columns:1fr}
.ph{display:none;position:relative;height:210px;border-radius:18px;overflow:hidden;border:1px solid var(--cy);box-shadow:0 0 40px rgba(0,240,255,.35);transition:transform .15s ease-out;transform-style:preserve-3d;animation:fl 6s ease-in-out infinite}
.vis:not(.np) .ph{display:block}
.ph img{width:100%;height:100%;display:block}
.scan{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--cy),transparent);box-shadow:0 0 18px var(--cy);animation:sc2 3s linear infinite}
@keyframes sc2{from{top:-4px}to{top:100%}}
.cr{position:absolute;width:26px;height:26px;border:2px solid var(--cy)}.c1{top:8px;left:8px;border-right:0;border-bottom:0}.c2{bottom:8px;right:8px;border-left:0;border-top:0}
@media(max-width:800px){.vis{grid-template-columns:1fr}}
/* ---------- Extra motion layer ---------- */
#glow{position:fixed;left:0;top:0;width:460px;height:460px;margin:-230px;border-radius:50%;background:radial-gradient(circle,rgba(0,240,255,.14),transparent 65%);pointer-events:none;z-index:0;transition:transform .12s ease-out}
#prog{position:fixed;top:calc(60px + env(safe-area-inset-top,0px));inset-inline:0;height:3px;z-index:21;background:rgba(255,255,255,.05)}
#prog i{display:block;height:100%;width:20%;background:linear-gradient(90deg,var(--cy),var(--pu));box-shadow:0 0 12px var(--cy);transition:width .7s cubic-bezier(.2,.9,.2,1)}
.btn,.tab{position:relative;overflow:hidden}
.rp{position:absolute;border-radius:50%;background:rgba(0,240,255,.5);transform:scale(0);animation:rpl .6s ease-out forwards;pointer-events:none}
@keyframes rpl{to{transform:scale(4);opacity:0}}
.w{display:inline-block;opacity:0;transform:translateY(10px);filter:blur(6px)}
.show .w{animation:wd .6s ease-out forwards;animation-delay:calc(var(--i)*22ms + .3s)}
@keyframes wd{to{opacity:1;transform:none;filter:blur(0)}}
.inner{position:relative;overflow:hidden}
.inner::after{content:'';position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(0,240,255,.2),transparent);transform:skewX(-20deg);pointer-events:none}
.show .inner::after{animation:sw2 1.4s .4s ease-out 1}
@keyframes sw2{to{left:130%}}
.rv{animation:rv .9s cubic-bezier(.2,.9,.2,1) both}
@keyframes rv{from{opacity:0;transform:translateY(30px) rotateX(-40deg);filter:blur(8px)}}
.tab::after{content:'';position:absolute;bottom:0;left:50%;width:0;height:2px;background:var(--cy);box-shadow:0 0 10px var(--cy);transition:.35s;transform:translateX(-50%)}
.tab:hover::after,.tab.on::after{width:80%}
.tab:not(.on){animation:tin .7s cubic-bezier(.2,.9,.2,1) both;animation-delay:calc(var(--i)*90ms)}
@keyframes tin{from{opacity:0;transform:translateY(24px) rotateX(60deg)}}
.grid.outb{opacity:0;transform:rotateY(25deg) translateX(-60px) scale(.94)}
.grid.inb{opacity:0;transform:rotateY(-25deg) translateX(60px) scale(.94)}
/* ---------- Topic cinematic, illustrations, start button ---------- */
#cine{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;perspective:900px;opacity:0;visibility:hidden;pointer-events:none;text-align:center}
#cine.on{animation:cv 2s ease both}
@keyframes cv{0%{opacity:0;visibility:visible}12%,78%{opacity:1;visibility:visible;background:rgba(5,7,11,.9)}100%{opacity:0;visibility:hidden}}
#cine .cn{font-family:'JetBrains Mono',monospace;color:var(--cy);letter-spacing:8px;font-size:1rem;direction:ltr}
#cine .cf{font-weight:900;font-size:clamp(3rem,12vw,8rem);line-height:1.3;background:linear-gradient(90deg,var(--cy),#fff,var(--pu));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 30px rgba(0,240,255,.6))}
#cine.on .cn{animation:rise 1s .1s cubic-bezier(.2,.9,.2,1) both}
#cine.on .cf{animation:rise 1.1s .3s cubic-bezier(.2,.9,.2,1) both}
#cine .bar{height:2px;width:0;background:linear-gradient(90deg,transparent,var(--cy),transparent);box-shadow:0 0 20px var(--cy);margin:14px 0}
#cine.on .bar{animation:bw 1.4s .2s ease-out both}
@keyframes bw{to{width:min(80vw,700px)}}
.start{font-size:1.15rem;padding:14px 38px;margin-top:34px;font-weight:700;animation:pulse 2s ease-in-out infinite;border-color:var(--cy)}
.vis{perspective:900px;margin-bottom:26px}
.vis svg{width:100%;height:210px;background:var(--glass);border:1px solid var(--bd);border-radius:18px;padding:14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 0 40px rgba(0,240,255,.15),inset 0 0 40px rgba(112,0,255,.1);transform:rotateX(10deg);animation:fl 5s ease-in-out infinite}
@keyframes fl{50%{transform:rotateX(4deg) translateY(-8px)}}
.nd{animation:np 2s ease-in-out infinite}@keyframes np{50%{opacity:.25}}
.nz{animation:nzm 3s ease-in-out infinite alternate}@keyframes nzm{to{transform:translateX(90px)}}
.ly{animation:lyr 3s ease-in-out infinite;opacity:0}@keyframes lyr{0%{opacity:0;transform:translateY(8px)}30%,100%{opacity:1;transform:none}}
.wv{animation:wv 2s linear infinite}@keyframes wv{from{stroke-dashoffset:300}to{stroke-dashoffset:0}}
.sc{animation:sw 3s ease-in-out infinite alternate}@keyframes sw{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
.stat{transition:transform .15s ease-out}
/* ---------- Hero 3D cube ---------- */
.cw{perspective:700px;height:190px;display:flex;align-items:center;justify-content:center;margin-top:20px}
.cube{width:120px;height:120px;position:relative;transform-style:preserve-3d;animation:cb 14s linear infinite}
.cube div{position:absolute;inset:0;border:1px solid var(--cy);background:rgba(0,240,255,.07);box-shadow:inset 0 0 26px rgba(0,240,255,.4),0 0 20px rgba(0,240,255,.35);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--cy);letter-spacing:2px;direction:ltr}
@keyframes cb{from{transform:rotateX(-25deg) rotateY(0)}to{transform:rotateX(335deg) rotateY(720deg)}}
/* ---------- Cinematic VR intro ---------- */
#intro{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 50%,#0d111a,#05070b);perspective:900px;overflow:hidden;display:flex;align-items:center;justify-content:center;transition:opacity .9s,visibility .9s}
#intro.done{opacity:0;visibility:hidden}
#intro .grid3d{position:absolute;inset:-50%;background:linear-gradient(rgba(0,240,255,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(0,240,255,.12) 1px,transparent 1px);background-size:60px 60px;transform:rotateX(75deg) translateY(30%);animation:gr 3s linear infinite;mask-image:radial-gradient(circle,#000 20%,transparent 65%);-webkit-mask-image:radial-gradient(circle,#000 20%,transparent 65%)}
@keyframes gr{to{background-position:0 60px}}
.stage{transform-style:preserve-3d;position:absolute}
.hs{position:relative;width:min(320px,70vw);height:min(160px,35vw);transform-style:preserve-3d;animation:sway 3.5s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotateY(-22deg) rotateX(8deg)}to{transform:rotateY(22deg) rotateX(-6deg)}}
.pc{position:absolute;animation:fly 1.5s cubic-bezier(.2,.9,.2,1) both;animation-delay:var(--d)}
@keyframes fly{from{transform:translate3d(var(--x),var(--y),var(--z)) rotate3d(1,1,0,var(--r));opacity:0}to{transform:none;opacity:1}}
.front{inset:0;border-radius:28px;background:linear-gradient(145deg,#1b2436,#0a0e18);border:1px solid var(--cy);box-shadow:0 0 40px rgba(0,240,255,.45),inset 0 0 30px rgba(41,121,255,.35)}
.lens{width:30%;aspect-ratio:1;top:22%;border-radius:50%;background:radial-gradient(circle,#fff 0,var(--cy) 18%,var(--bl) 50%,#0a0e18 72%);border:2px solid var(--cy);box-shadow:0 0 30px var(--cy);transform:translateZ(14px);animation-name:fly,lp;animation-duration:1.5s,1.6s;animation-iteration-count:1,infinite;animation-delay:var(--d),2s}
@keyframes lp{50%{box-shadow:0 0 60px var(--cy),0 0 100px var(--bl)}}
.lL{left:12%}.lR{right:12%}
.strap{background:linear-gradient(#1b2436,#0a0e18);border:1px solid var(--bl);box-shadow:0 0 20px rgba(41,121,255,.5)}
.sL{left:-22%;width:22%;top:30%;height:36%;border-radius:12px 0 0 12px}.sR{right:-22%;width:22%;top:30%;height:36%;border-radius:0 12px 12px 0}
.sT{left:34%;width:32%;top:-38%;height:38%;border-radius:12px 12px 0 0}
.flash{position:absolute;inset:0;background:radial-gradient(circle,#fff,var(--cy) 30%,transparent 70%);opacity:0;pointer-events:none}
.zoom .stage{animation:zm 1.1s cubic-bezier(.7,0,.9,.5) forwards}
@keyframes zm{to{transform:translateZ(850px) scale(3);opacity:0}}
.zoom .flash{animation:fl 1.1s ease-in forwards}
@keyframes fl{60%{opacity:0}85%{opacity:1}to{opacity:0}}
.who{position:absolute;text-align:center;transform-style:preserve-3d;opacity:0;pointer-events:none}
.name .who{opacity:1}
.who>*{opacity:0}
.name .who>*{animation:rise 1.2s cubic-bezier(.2,.9,.2,1) both}
.pl{direction:ltr;color:var(--cy);letter-spacing:6px;font-size:.8rem;margin-bottom:10px}
.w1{font-weight:300;font-size:clamp(1.2rem,4vw,2.2rem);color:var(--mu);animation-delay:.2s!important}
.w2{font-weight:900;font-size:clamp(3rem,13vw,9rem);line-height:1.2;background:linear-gradient(90deg,var(--cy),#fff,var(--pu),var(--cy));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 24px rgba(0,240,255,.6));animation-delay:.5s!important;animation-name:rise,shift,tw!important;animation-duration:1.2s,4s,4s!important;animation-iteration-count:1,infinite,infinite!important}
@keyframes tw{0%,100%{transform:rotateY(-12deg)}50%{transform:rotateY(12deg)}}
.w3{color:var(--mu);font-size:.8rem;letter-spacing:4px;margin-top:14px;animation-delay:1s!important}
@keyframes rise{from{opacity:0;transform:translateZ(-700px) rotateX(85deg)}to{opacity:1;transform:none}}
.rings{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
.rings i{position:absolute;border:1px solid var(--cy);border-radius:50%;box-shadow:0 0 20px rgba(0,240,255,.5),inset 0 0 20px rgba(112,0,255,.4);animation:rg 6s linear infinite}
.rings i:nth-child(1){width:360px;height:360px;margin:-180px}.rings i:nth-child(2){width:520px;height:520px;margin:-260px;animation-duration:9s;border-color:var(--bl)}.rings i:nth-child(3){width:700px;height:700px;margin:-350px;animation-duration:13s;border-color:var(--pu)}
@keyframes rg{from{transform:rotateX(70deg) rotateZ(0)}to{transform:rotateX(70deg) rotateZ(360deg)}}
#skip{position:absolute;bottom:24px;inset-inline-start:24px;z-index:3}
.pres{margin-top:22px;font-weight:300;color:var(--mu);font-size:1.1rem}
.pres b{color:var(--cy);font-weight:700}
.hero{position:relative}
.orb{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d;z-index:-1;pointer-events:none}
.orb i{position:absolute;border:1px solid rgba(0,240,255,.25);border-radius:50%;animation:rg 14s linear infinite}
.orb i:nth-child(1){width:560px;height:560px;margin:-280px}.orb i:nth-child(2){width:760px;height:760px;margin:-380px;animation-duration:22s;border-color:rgba(112,0,255,.3)}
@media(max-width:800px){.rings i{transform:rotateX(70deg) scale(.6)}}
@media(max-width:800px){.grid{grid-template-columns:1fr}.hint{display:none}.inner{padding:20px}header{padding:0 14px}}
html,body{overflow-x:hidden;overflow-x:clip;max-width:100%}html{touch-action:pan-y pinch-zoom}
header{gap:8px}.hr{flex-shrink:0}.btn,#timer{white-space:nowrap}
@media(max-width:600px){header{padding:0 10px}.brand{font-size:.78rem;white-space:nowrap}.brand b{display:none}.hr{gap:6px}#timer{font-size:.78rem;padding:4px 8px}.hr .btn{padding:6px 9px;font-size:.74rem}footer{padding:8px 10px}footer .btn{padding:8px 10px;font-size:.8rem}}main{overflow-x:clip}.hero{overflow:hidden}#intro{width:100%;height:100%;contain:paint}
</style>
</head>
<body>
<canvas id="bg"></canvas><div id="glow"></div><div id="prog"><i></i></div>
<div id="cine"><div class="cn" id="cn"></div><div class="bar"></div><div class="cf" id="cf"></div><div class="bar"></div></div>
<div id="intro">
  <div class="grid3d"></div>
  <div class="stage"><div class="hs">
    <div class="pc strap sT" style="--x:0;--y:-900px;--z:300px;--r:80deg;--d:.1s"></div>
    <div class="pc strap sL" style="--x:-1200px;--y:0;--z:100px;--r:-70deg;--d:.25s"></div>
    <div class="pc strap sR" style="--x:1200px;--y:0;--z:100px;--r:70deg;--d:.4s"></div>
    <div class="pc front" style="--x:0;--y:0;--z:-1500px;--r:60deg;--d:.55s"></div>
    <div class="pc lens lL" style="--x:-900px;--y:800px;--z:200px;--r:90deg;--d:.8s"></div>
    <div class="pc lens lR" style="--x:900px;--y:800px;--z:200px;--r:-90deg;--d:.95s"></div>
  </div></div>
  <div class="flash"></div>
  <div class="who">
    <div class="rings"><i></i><i></i><i></i></div>
    <div class="pl mono">// PRESENTED BY</div>
    <div class="w1">ارائه‌دهنده</div>
    <div class="w2">نوید صادقی</div>
    <div class="w3 mono">EMERGING TECHNOLOGIES — 2026</div>
  </div>
  <button class="btn" id="skip">رد کردن</button>

/* ---------- Scroll reveal ---------- */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('show');io.unobserve(e.target)}}),{threshold:.15});
/* ---------- 3D tilt on cards ---------- */
function bindCards(){
  document.querySelectorAll('.card').forEach((c,i)=>{
    c.style.transitionDelay=(i*90)+'ms';io.observe(c);
    const n=c.firstChild;
    c.addEventListener('mousemove',e=>{const r=c.getBoundingClientRect();
      const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
      n.style.transform=`rotateX(${-y*10}deg) rotateY(${x*10}deg) translateZ(8px)`});
    c.addEventListener('mouseleave',()=>n.style.transform='');
  });
}

function go(i){

  const g=$('grid'),f=i>cur,o=f?'out':'outb',n=f?'in':'inb';g.classList.add(o);

(function(){const cv=$('bg'),ctx=cv.getContext('2d');let W,H,P=[];

  size();addEventListener('resize',size);
  (function draw(){ctx.clearRect(0,0,W,H);
    for(const p of P){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
      ctx.beginPath();ctx.arc(p.x,p.y,1.6,0,6.283);ctx.fillStyle='rgba(0,240,255,.8)';ctx.shadowColor='#00f0ff';ctx.shadowBlur=8;ctx.fill()}

/* ---------- Fullscreen cinematic title card (conference-style topic opening) ---------- */
function cine(i){const c=$('cine');$('cn').textContent='MODULE 0'+(i+1);$('cf').textContent=T[i].fa;c.classList.remove('on');void c.offsetWidth;c.classList.add('on')}
$('start').onclick=()=>openTopic(cur);
function toContent(){scrollTo({top:$('content').getBoundingClientRect().top+scrollY-72,left:0,behavior:'smooth'})}
function openTopic(i){if(i===cur){cine(cur);toContent()}else go(i)}
$('ring3').innerHTML=T.map((t,i)=>`<div class="pn" data-i="${i}" style="transform:rotateY(${i*72}deg) translateZ(var(--rad))">${t.fa}</div>`).join('');
$('ring3').onclick=e=>{if(e.target.dataset.i)openTopic(+e.target.dataset.i)};
/* Scramble ("decrypt") text effect */
function scr(el,txt){let n=0;clearInterval(el._t);el._t=setInterval(()=>{n+=2;el.textContent=txt.split('').map((c,i)=>c===' '||i<n?c:'ABCDEF0123456789#/<>_'[Math.random()*21|0]).join('');if(n>=txt.length)clearInterval(el._t)},30)}
/* Magnetic buttons */
document.addEventListener('mousemove',e=>{const b=e.target.closest&&e.target.closest('.btn');if(b){const r=b.getBoundingClientRect();b.style.transform=`translate(${(e.clientX-r.left-r.width/2)*.15}px,${(e.clientY-r.top-r.height/2)*.25}px) scale(1.06)`}});
document.addEventListener('mouseout',e=>{const b=e.target.closest&&e.target.closest('.btn');if(b)b.style.transform=''});
const AC=['#00f0ff','#4d8dff','#a066ff','#00ffc8','#66e0ff'];
/* Tilt for stat cards */
document.querySelectorAll('.stat').forEach(c=>{
  c.addEventListener('mousemove',e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform=`perspective(500px) rotateX(${-y*18}deg) rotateY(${x*18}deg) scale(1.05)`});
  c.addEventListener('mouseleave',()=>c.style.transform='')});
/* ---------- Global motion: cursor glow, ripples, hero scroll fade ---------- */
addEventListener('mousemove',e=>{$('glow').style.transform=`translate(${e.clientX}px,${e.clientY}px)`});
addEventListener('touchmove',e=>{const t=e.touches[0];$('glow').style.transform=`translate(${t.clientX}px,${t.clientY}px)`},{passive:true});
document.addEventListener('click',e=>{const b=e.target.closest('.btn,.tab');if(!b)return;
  const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height),p=document.createElement('span');p.className='rp';
  p.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;b.appendChild(p);setTimeout(()=>p.remove(),600)});
addEventListener('scroll',()=>{const h=$('hero'),o=Math.max(0,1-scrollY/450);h.style.opacity=o;h.style.visibility=o<=0?'hidden':'visible'},{passive:true});
const phe=document.querySelector('.ph');
phe.addEventListener('mousemove',e=>{const r=phe.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;phe.style.animation='none';phe.style.transform=`perspective(700px) rotateX(${-y*22}deg) rotateY(${x*22}deg) scale(1.04)`});
phe.addEventListener('mouseleave',()=>{phe.style.transform='';phe.style.animation=''});
/* ---------- Intro timeline (replayable): assemble -> zoom -> name -> exit ---------- */
(function(){const el=$('intro');let tm=[],fin=false,first=true;
  function end(){if(fin)return;fin=true;tm.forEach(clearTimeout);el.classList.add('done');if(first){t0=Date.now();first=false;setTimeout(()=>cine(cur),500)}}
  function play(){tm.forEach(clearTimeout);fin=false;el.classList.remove('done','zoom','name');
    el.style.display='none';void el.offsetWidth;el.style.display='';scrollTo(0,0);
    tm=[setTimeout(()=>el.classList.add('zoom'),2600),setTimeout(()=>el.classList.add('name'),3500),setTimeout(end,8000)]}
  $('skip').onclick=end;$('replay').onclick=play;
  addEventListener('keydown',e=>{if(!fin&&['Enter',' ','Escape'].includes(e.key))end()});
  play()})();
